name: CI

on:
  push:
    branches: [main, phase-7]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  phase0c-windows:
    name: Phase 0C voice_delivery (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635cc071259e90169279235f2 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-17

      - name: voice_delivery Windows runtime tests
        run: |
          cargo test -p stream-sync-windows-fs
          cargo test -p stream-sync-core 'voice_delivery::fs::' -- --nocapture
          cargo test -p stream-sync-core 'voice_delivery::lock::' -- --nocapture --test-threads=1
          cargo test -p stream-sync-core 'voice_delivery::ids::' -- --nocapture

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635cc071259e90169279235f2 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-17

      - uses: actions/setup-node@39370e3970a6d50c2d2874e57cc9f70c5a19153b # v4.1.0
        with:
          node-version: "20"

      - name: npm install
        run: npm ci

      - name: version consistency
        run: node scripts/check-version-consistency.js

      - name: desktop icon validity
        run: node scripts/check-desktop-icons.js

      - name: NSIS installer
        run: npx tauri build --bundles nsis --ci
        working-directory: crates/stream-sync-desktop

  signed-release:
    name: Signed artifacts (when signing infra exists)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Signing not configured
        run: |
          if [ -z "${{ secrets.WINDOWS_CERT_P12 }}" ]; then
            echo "Signing infrastructure is not ready. Skip provenance until a certificate secret is installed."
            exit 0
          fi
          echo "Certificate secret is present; wire Authenticode in a follow-up. Refusing to sign with an incomplete workflow."
          exit 1
        shell: bash
