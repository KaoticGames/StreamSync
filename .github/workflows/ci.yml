name: CI

on:
  push:
    branches: [main, phase-7]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  phase0c-windows:
    name: Phase 0C voice_delivery (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-17

      - name: voice_delivery Windows runtime tests
        run: |
          set -e
          cargo test -p stream-sync-windows-fs
          cargo test -p stream-sync-core 'voice_delivery::fs::' -- --nocapture
          cargo test -p stream-sync-core 'voice_delivery::lock::' -- --nocapture --test-threads=1
          cargo test -p stream-sync-core 'voice_delivery::ids::' -- --nocapture
          count_suite_tests() { cargo test -p stream-sync-core "$1" -- --list 2>/dev/null | grep -cE ": test\r?$" || true; }
          run_suite() { n=$(count_suite_tests "$1"); echo "filter '$1' matched $n tests"; test "$n" -gt 0; cargo test -p stream-sync-core "$1" -- --nocapture; }
          run_suite 'voice_delivery::bounds::'
          run_suite 'voice_delivery::wav::'
          run_suite 'voice_delivery::hash::'
          run_suite 'voice_delivery::manifest::'
          run_suite 'voice_delivery::records::'
          run_suite 'voice_delivery::ingest::'
          cargo test -p stream-sync-core --test voice_delivery_v2_r2_redirect -- --nocapture
          cargo test -p stream-sync-core --test voice_delivery_v2_http_orchestrator_e2e -- --nocapture
          cargo test -p stream-sync-core --test voice_delivery_v2_recovery_report -- --nocapture
          node scripts/verify-voice-delivery-v2-reviewer-fixture.mjs
          run_suite 'cross_language_golden_manifest_with_recovery_report_reviewer'
          run_suite 'ledger_persists_recovery_report_identity'
          run_suite 'delivers_manifest_with_recovery_report_then_receipts'
          run_suite 'corrupt_recovery_report_bytes_block_receipt'
          run_suite 'recovery_report_receipt_retry_after_interrupt_completes_once'
          run_suite 'recovery_report_api_307_r2_206_without_bearer'
          run_suite 'http_orchestrator_publishes_wav_and_report_then_receipts'
          run_suite 'reviewer_fixture_bytes_and_digest_gate'
          run_suite 'windows_recovery_report_publication'
          run_suite 'voice_delivery::marker::'
          run_suite 'voice_delivery::session::'
          run_suite 'voice_delivery::state::'
          run_suite 'partial_prefix_hasher_checkpoint'
          run_suite 'partial_contiguous_overlap_behavior'
          run_suite 'partial_restart_single_prefix_pass'
          run_suite 'checkpoint_adversarial'
          run_suite 'checkpoint_store_guard_lifetime'
          run_suite 'portable_parent_component_deserialize_bypass'
          run_suite 'session_constructor_substitution'
          run_suite 'generation_domain_bounds'
          run_suite 'ledger_generation_wins_valid'
          run_suite 'publish_intent_before_rename'
          run_suite 'recover_rename_outcome_matrix'
          run_suite 'injectable_rename_outcome_matrix'
          run_suite 'publication_child_probe_matrix'
          run_suite 'post_seal_corruption'
          run_suite 'publication_reparse_collision'
          run_suite 'publication_durability_order'
          run_suite 'crash_child_process_publication'
          run_suite 'delivery_bound_lock'
          run_suite 'rename_no_replace_write_through_same_parent_tests'
          run_suite 'read_file_all_rejects_file_symlink_external_target_unchanged'
          run_suite 'receipt_intent_persist_and_reload'
          run_suite 'receipt_intent_mismatch_is_conflict'
          run_suite 'receipt_ack_must_match_intent'
          run_suite 'receipt_intent_conflicting_concurrent_create_atomic'
          run_suite 'receipt_intent_identical_concurrent_idempotent_atomic'
          run_suite 'receipt_ack_identical_concurrent_idempotent_atomic'
          run_suite 'persist_receipt_ack_must_not_validate_intent_before_receipt_install_lock'
          run_suite 'persist_receipt_ack_validates_intent_under_receipt_install_lock'
          run_suite 'journal_session_bootstrap_security_windows'
        shell: bash

  phase0c-linux-receipt-durability:
    name: Phase 0C receipt durability (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-17

      - name: receipt durability Linux gates
        run: |
          set -e
          count_suite_tests() { cargo test -p stream-sync-core "$1" -- --list 2>/dev/null | grep -cE ': test$' || true; }
          run_suite() { n=$(count_suite_tests "$1"); echo "filter '$1' matched $n tests"; test "$n" -gt 0; cargo test -p stream-sync-core "$1" -- --nocapture; }
          run_suite 'journal_session_bootstrap_security'
          run_suite 'receipt_symlink_no_follow_security'
          run_suite 'receipt_intent_winning_install_rejects_unavailable_dir_sync'
          run_suite 'receipt_ack_winning_install_rejects_unavailable_dir_sync'
          run_suite 'persist_receipt_intent_blocks_on_external_receipt_install_lock'
          run_suite 'collision_requires_dir_sync_before_ok'
          FEATURES=local-opus-native,local-opus-vendored,lifecycle-test-support
          TARGET=in_sync_lifecycle_receipt_after_publication_checkpoint
          n=$(cargo test -p stream-sync-core --test "$TARGET" --features "$FEATURES" -- --list 2>/dev/null | grep -cE ': test$' || true)
          echo "integration target $TARGET listed $n tests"
          test "$n" -eq 9
          cargo test -p stream-sync-core --test "$TARGET" --features "$FEATURES" -- --nocapture
          TARGET=in_sync_lifecycle_cancel_checkpoint
          n=$(cargo test -p stream-sync-core --test "$TARGET" --features "$FEATURES" -- --list 2>/dev/null | grep -cE ': test$' || true)
          echo "integration target $TARGET listed $n tests"
          test "$n" -eq 5
          cargo test -p stream-sync-core --test "$TARGET" --features "$FEATURES" -- --nocapture
        shell: bash

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-17

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: npm install
        run: npm ci

      - name: version consistency
        run: node scripts/check-version-consistency.js

      - name: desktop icon validity
        run: node scripts/check-desktop-icons.js

      - name: NSIS installer
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: npx tauri build --features windows-vendored-opus --bundles nsis --ci --no-sign --config tauri.ci.conf.json
        working-directory: crates/stream-sync-desktop

      - uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: StreamSync-2.1.001-windows-nsis-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            crates/stream-sync-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  signed-release:
    name: Signed artifacts (when signing infra exists)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Signing not configured
        run: |
          if [ -z "${{ secrets.WINDOWS_CERT_P12 }}" ]; then
            echo "Signing infrastructure is not ready. Skip provenance until a certificate secret is installed."
            exit 0
          fi
          echo "Certificate secret is present; wire Authenticode in a follow-up. Refusing to sign with an incomplete workflow."
          exit 1
        shell: bash
