[package]
name = "stream-sync-core"
description = "Stream Sync overlay server — HTTP, WebSocket, Twitch (Rust port)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "stream_sync_core"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
twitch-irc.workspace = true
dotenvy.workspace = true
urlencoding.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tokio-tungstenite.workspace = true
reqwest.workspace = true
serde_json.workspace = true

[[example]]
name = "host_embed"
path = "examples/host_embed.rs"
