[package]
name = "stream-sync-desktop"
description = "Stream Sync desktop shell (Tauri + stream-sync-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "stream_sync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stream-sync-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stream-sync-core = { path = "../stream-sync-core", features = ["local-opus-native"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = "6"
dotenvy = { workspace = true }
open = "5"
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rfd = "0.15"
semver = "1.0.28"

[features]
default = []
# Windows CI/dev: statically bundle libopus via audiopus_sys (CMake); Unix uses system libopus.
windows-vendored-opus = ["stream-sync-core/local-opus-vendored"]

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
