[[permission]]
identifier = "allow-remote-main-ui"
description = "Narrow native commands for the external main StreamSync webview (validated in Rust)"
commands.allow = [
  "get_overlay_base_url",
  "get_overlay_port",
  "open_external",
  "open_logs_folder",
  "pick_recording_folder",
  "open_discord",
  "open_se_account_page",
  "export_backup",
  "restore_backup",
  "get_update_status",
  "check_for_updates",
  "check_for_updates_manual",
  "begin_update_install",
  "dismiss_update",
  "open_update_fallback_page",
  "purge_logs",
]
