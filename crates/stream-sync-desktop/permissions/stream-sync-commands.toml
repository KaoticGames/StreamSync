[[permission]]
identifier = "allow-stream-sync-commands"
description = "Stream Sync desktop invoke commands (non-secret)"
commands.allow = [
  "get_overlay_base_url",
  "get_overlay_port",
  "open_external",
  "open_logs_folder",
  "pick_recording_folder",
  "open_discord",
  "twitch_connect",
  "twitch_reconnect",
  "twitch_disconnect",
  "kick_connect",
  "purge_logs",
  "get_update_status",
  "check_for_updates",
  "check_for_updates_manual",
  "begin_update_install",
  "dismiss_update",
  "open_update_fallback_page",
  "open_se_account_page",
  "export_backup",
  "restore_backup",
]
