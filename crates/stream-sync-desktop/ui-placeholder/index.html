<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream Sync</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --panel: #0f172a;
        --accent: #38bdf8;
        --accent-dim: #0ea5e9;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --track: #1e293b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 0%, #132036 0%, var(--bg) 55%);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      .shell {
        width: min(360px, calc(100vw - 2rem));
        padding: 1.75rem 1.5rem 1.5rem;
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .mark {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
        box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent);
      }

      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .tagline {
        margin: 0.15rem 0 0;
        font-size: 0.8125rem;
        color: var(--muted);
      }

      progress {
        width: 100%;
        height: 0.5rem;
        appearance: none;
        border: none;
        border-radius: 999px;
        overflow: hidden;
        background: var(--track);
      }

      progress::-webkit-progress-bar {
        background: var(--track);
        border-radius: 999px;
      }

      progress::-webkit-progress-value {
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        border-radius: 999px;
        transition: width 0.25s ease;
      }

      progress::-moz-progress-bar {
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        border-radius: 999px;
      }

      .meter-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0.75rem 0 0.35rem;
      }

      #startup-percent {
        font-variant-numeric: tabular-nums;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--accent);
      }

      #startup-status {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.45;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="startup-heading">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <h1 id="startup-heading">Stream Sync</h1>
          <p class="tagline">Local overlay &amp; connections</p>
        </div>
      </div>
      <progress
        id="startup-progress-bar"
        max="100"
        value="10"
        aria-labelledby="startup-status"
      ></progress>
      <div class="meter-row">
        <p id="startup-status" role="status">Preparing data…</p>
        <span id="startup-percent" aria-hidden="true">10%</span>
      </div>
    </main>
    <script>
      (function () {
        const bar = document.getElementById("startup-progress-bar");
        const statusEl = document.getElementById("startup-status");
        const percentEl = document.getElementById("startup-percent");
        let lastPercent = 10;

        function applyProgress(nextPercent, stageText) {
          const clamped = Math.min(100, Math.max(0, Math.floor(Number(nextPercent))));
          if (!Number.isFinite(clamped) || clamped < lastPercent) {
            return;
          }
          lastPercent = clamped;
          if (bar) {
            bar.value = clamped;
          }
          if (percentEl) {
            percentEl.textContent = clamped + "%";
          }
          if (typeof stageText === "string" && stageText.trim() && statusEl) {
            statusEl.textContent = stageText.trim();
          }
        }

        const tauri = window.__TAURI__;
        if (tauri && tauri.event && typeof tauri.event.listen === "function") {
          tauri.event.listen("startup-progress", function (event) {
            const payload = event && event.payload;
            if (!payload || typeof payload !== "object") {
              return;
            }
            const percent =
              payload.percent !== undefined ? payload.percent : payload.progress;
            const stage =
              typeof payload.stage === "string"
                ? payload.stage
                : typeof payload.message === "string"
                  ? payload.message
                  : undefined;
            applyProgress(percent, stage);
          });
        }
      })();
    </script>
  </body>
</html>
