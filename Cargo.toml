[workspace]
resolver = "2"
members = [
    "crates/stream-sync-core",
    "crates/stream-sync-server",
    "crates/stream-sync-desktop",
]
default-members = ["crates/stream-sync-desktop"]

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "MIT"
authors = ["Kaotic Games"]

[workspace.dependencies]
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"], default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
twitch-irc = { version = "5", features = ["transport-tcp"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }
urlencoding = "2"
dirs = "6"
